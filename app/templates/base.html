<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>MiniCRM — {% block title %}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1c2434; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #dfe3ea; padding: .5rem .75rem; text-align: left; }
    th { background: #f4f6fa; }
    .summary { background: #eef4ff; padding: .75rem 1rem; border-radius: 6px; }
    .nav a { margin-right: 1rem; }
    .badge { padding: .15rem .5rem; border-radius: 4px; background: #e6e9f0; font-size: .85rem; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="{{ url_for('main.offer_list') }}">Oferty</a>
    <a href="{{ url_for('main.client_list') }}">Klienci</a>
    {% if user %}<span>Zalogowany: <strong>{{ user.name }}</strong> ({{ user.role }})</span>
    <a href="{{ url_for('main.logout') }}">Wyloguj</a>{% endif %}
  </div>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
