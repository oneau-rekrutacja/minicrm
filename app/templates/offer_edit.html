{% extends "base.html" %}
{% block title %}Edycja {{ offer.number }}{% endblock %}
{% block content %}
<h1>Edycja oferty {{ offer.number }}</h1>
<form method="post">
  <p><label>Kwota netto: <input name="net_amount" type="number" step="0.01" value="{{ offer.net_amount }}"></label></p>
  <p><label>Rabat (%): <input name="discount_percent" type="number" step="1" value="{{ offer.discount_percent }}"></label></p>
  <p><label>Status:
    <select name="status">
      {% for s in statuses %}<option value="{{ s }}" {% if s == offer.status %}selected{% endif %}>{{ s }}</option>{% endfor %}
    </select>
  </label></p>
  <button type="submit">Zapisz</button>
</form>
{% endblock %}
